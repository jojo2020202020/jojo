<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Her Moon — A Celestial Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
    --gold:#e8d5a3;
    --soft-gold:#c9b896;
    --moon-glow:rgba(232,213,163,0.15);
    --star-bright:rgba(255,255,255,0.95);
    --star-dim:rgba(255,255,255,0.35);
    --text-primary:#f0ece4;
    --text-secondary:#b8b0a0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030308;
    font-family:'Cormorant Garamond',serif;
    color:var(--text-primary);
}

/* ===== CANVAS LAYERS ===== */
#starCanvas, #particleCanvas{
    position:fixed;
    inset:0;
    pointer-events:none;
}
#starCanvas{z-index:1;}
#particleCanvas{z-index:3;}

/* ===== VIGNETTE & ATMOSPHERE ===== */
#vignette{
    position:fixed;
    inset:0;
    background:
        radial-gradient(ellipse at 50% 20%, transparent 30%, rgba(3,3,8,0.6) 70%, rgba(3,3,8,0.95) 100%),
        radial-gradient(ellipse at 50% 80%, rgba(10,12,25,0.4) 0%, transparent 60%);
    z-index:2;
    pointer-events:none;
}

/* ===== MOON CONTAINER ===== */
#moonContainer{
    position:absolute;
    top:18%;
    left:50%;
    transform:translateX(-50%);
    z-index:4;
    opacity:0;
}

/* Realistic Moon with CSS */
.moon{
    width:260px;
    height:260px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 25%, rgba(255,255,255,0.95) 0%, rgba(240,235,220,0.9) 20%, rgba(200,190,170,0.85) 45%, rgba(160,150,130,0.8) 70%, rgba(120,110,95,0.75) 100%);
    box-shadow:
        inset -25px -15px 40px rgba(0,0,0,0.4),
        inset 15px 10px 30px rgba(255,255,255,0.3),
        0 0 60px rgba(232,213,163,0.12),
        0 0 120px rgba(232,213,163,0.06),
        0 0 200px rgba(232,213,163,0.03);
    position:relative;
    overflow:hidden;
}

/* Moon craters */
.moon::before{
    content:'';
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:
        radial-gradient(circle at 30% 40%, rgba(140,130,115,0.25) 0%, transparent 18%),
        radial-gradient(circle at 65% 30%, rgba(130,120,105,0.2) 0%, transparent 12%),
        radial-gradient(circle at 50% 65%, rgba(150,140,125,0.22) 0%, transparent 22%),
        radial-gradient(circle at 25% 70%, rgba(135,125,110,0.18) 0%, transparent 10%),
        radial-gradient(circle at 75% 60%, rgba(145,135,120,0.2) 0%, transparent 15%),
        radial-gradient(circle at 45% 25%, rgba(125,115,100,0.15) 0%, transparent 8%),
        radial-gradient(circle at 80% 45%, rgba(140,130,115,0.17) 0%, transparent 11%);
}

/* Moon glow ring */
.moon-glow{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:340px;
    height:340px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(232,213,163,0.08) 0%, transparent 70%);
    filter:blur(20px);
    pointer-events:none;
}

.moon-outer-glow{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:500px;
    height:500px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(200,190,170,0.04) 0%, transparent 60%);
    filter:blur(40px);
    pointer-events:none;
}

/* ===== TITLE ===== */
#moonTitle{
    position:absolute;
    top:8%;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    text-align:center;
    opacity:0;
}

#moonTitle .line1{
    font-family:'Cinzel',serif;
    font-size:clamp(10px,1.4vw,16px);
    letter-spacing:12px;
    color:var(--soft-gold);
    text-transform:uppercase;
    margin-bottom:8px;
    opacity:0.7;
}

#moonTitle .line2{
    font-family:'Playfair Display',serif;
    font-size:clamp(24px,4vw,48px);
    font-weight:400;
    letter-spacing:4px;
    color:var(--gold);
    text-shadow:
        0 0 20px rgba(232,213,163,0.3),
        0 0 60px rgba(232,213,163,0.1);
}

#moonTitle .line3{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(12px,1.6vw,18px);
    font-style:italic;
    color:var(--text-secondary);
    margin-top:6px;
    letter-spacing:3px;
}

/* ===== INTRO SEQUENCE ===== */
#introSequence{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:10;
    background:#030308;
    transition:opacity 2s ease, visibility 2s;
}

#introText{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(22px,5vw,38px);
    font-weight:300;
    font-style:italic;
    text-align:center;
    max-width:80%;
    line-height:1.6;
    color:var(--text-primary);
    text-shadow:0 0 30px rgba(255,255,255,0.1);
    min-height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
}

#introText .char{
    display:inline-block;
    opacity:0;
    transform:translateY(20px);
    transition:opacity 0.6s ease, transform 0.6s ease;
}

#introText .char.visible{
    opacity:1;
    transform:translateY(0);
}

#introText .space{display:inline;width:0.3em;}

/* Decorative line under intro */
.intro-line{
    position:absolute;
    bottom:35%;
    left:50%;
    transform:translateX(-50%) scaleX(0);
    width:120px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--soft-gold), transparent);
    transition:transform 1.5s ease 0.5s;
}
.intro-line.visible{transform:translateX(-50%) scaleX(1);}

/* ===== MAIN TEXT ===== */
#moonTextContainer{
    position:absolute;
    top:62%;
    left:50%;
    transform:translateX(-50%);
    width:min(90%, 560px);
    z-index:5;
    text-align:center;
    opacity:0;
}

#moonText{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(18px,3.5vw,30px);
    font-weight:300;
    line-height:1.7;
    color:var(--text-primary);
    text-shadow:
        0 0 10px rgba(255,255,255,0.15),
        0 0 30px rgba(200,190,170,0.08);
    white-space:pre-line;
}

#moonText .cursor{
    display:inline-block;
    width:2px;
    height:1em;
    background:var(--soft-gold);
    margin-left:3px;
    vertical-align:middle;
    animation:cursorBlink 1s infinite;
}

@keyframes cursorBlink{
    0%,100%{opacity:1;}
    50%{opacity:0;}
}

/* ===== SCROLL INDICATOR ===== */
#scrollHint{
    position:absolute;
    bottom:5%;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    opacity:0;
    text-align:center;
}

#scrollHint .mouse{
    width:22px;
    height:36px;
    border:1.5px solid rgba(200,190,170,0.4);
    border-radius:12px;
    margin:0 auto 8px;
    position:relative;
}

#scrollHint .mouse::after{
    content:'';
    position:absolute;
    top:6px;
    left:50%;
    transform:translateX(-50%);
    width:3px;
    height:6px;
    background:rgba(200,190,170,0.5);
    border-radius:2px;
    animation:scrollWheel 2s infinite;
}

@keyframes scrollWheel{
    0%{top:6px;opacity:1;}
    100%{top:18px;opacity:0;}
}

#scrollHint span{
    font-family:'Cinzel',serif;
    font-size:10px;
    letter-spacing:4px;
    color:var(--text-secondary);
    text-transform:uppercase;
}

/* ===== SHOOTING STARS ===== */
.shooting-star{
    position:fixed;
    width:120px;
    height:2px;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.9), rgba(255,255,255,0));
    transform:rotate(-45deg);
    opacity:0;
    pointer-events:none;
    z-index:2;
    filter:blur(0.5px);
}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
    .moon{width:180px;height:180px;}
    .moon-glow{width:240px;height:240px;}
    .moon-outer-glow{width:350px;height:350px;}
    #moonContainer{top:22%;}
    #moonTextContainer{top:58%;}
}
</style>
<base target="_blank">
</head>

<body>

<!-- Canvases -->
<canvas id="starCanvas"></canvas>
<canvas id="particleCanvas"></canvas>
<div id="vignette"></div>

<!-- Intro Sequence -->
<div id="introSequence">
    <div style="position:relative;">
        <div id="introText"></div>
        <div class="intro-line"></div>
    </div>
</div>

<!-- Moon -->
<div id="moonContainer">
    <div class="moon-outer-glow"></div>
    <div class="moon-glow"></div>
    <div class="moon"></div>
</div>

<!-- Title -->
<div id="moonTitle">
    <div class="line1">A Celestial Memory</div>
    <div class="line2">The Moon</div>
    <div class="line3">02 . 03 . 2006</div>
</div>

<!-- Main Text -->
<div id="moonTextContainer">
    <div id="moonText"><span class="cursor"></span></div>
</div>

<!-- Scroll Hint -->
<div id="scrollHint">
    <div class="mouse"></div>
    <span>Continue</span>
</div>

<script>
/* ============================
   STAR FIELD (Canvas)
   ============================ */
const starCanvas = document.getElementById('starCanvas');
const starCtx = starCanvas.getContext('2d');
let stars = [];
const STAR_COUNT = 800;

function resizeCanvas(){
    starCanvas.width = window.innerWidth;
    starCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Star{
    constructor(){
        this.reset();
        this.y = Math.random() * starCanvas.height;
    }
    reset(){
        this.x = Math.random() * starCanvas.width;
        this.y = -10;
        this.size = Math.random() < 0.92 ? Math.random() * 1.2 + 0.3 : Math.random() * 2.5 + 1;
        this.speed = this.size * 0.15;
        this.opacity = Math.random() * 0.6 + 0.2;
        this.twinkleSpeed = Math.random() * 0.02 + 0.005;
        this.twinklePhase = Math.random() * Math.PI * 2;
        this.color = Math.random() < 0.05 ? '210,220,240' : '255,255,255';
    }
    update(){
        this.y += this.speed;
        this.twinklePhase += this.twinkleSpeed;
        if(this.y > starCanvas.height + 10) this.reset();
    }
    draw(){
        const twinkle = 0.5 + 0.5 * Math.sin(this.twinklePhase);
        const alpha = this.opacity * twinkle;
        starCtx.beginPath();
        starCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        starCtx.fillStyle = `rgba(${this.color},${alpha})`;
        starCtx.fill();
        if(this.size > 1.5){
            starCtx.beginPath();
            starCtx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
            starCtx.fillStyle = `rgba(${this.color},${alpha * 0.15})`;
            starCtx.fill();
        }
    }
}

for(let i=0; i<STAR_COUNT; i++) stars.push(new Star());

function animateStars(){
    starCtx.clearRect(0,0,starCanvas.width,starCanvas.height);
    stars.forEach(s=>{s.update();s.draw();});
    requestAnimationFrame(animateStars);
}
animateStars();

/* ============================
   PARTICLE SYSTEM (Canvas)
   ============================ */
const pCanvas = document.getElementById('particleCanvas');
const pCtx = pCanvas.getContext('2d');
let particles = [];

function resizePCanvas(){
    pCanvas.width = window.innerWidth;
    pCanvas.height = window.innerHeight;
}
resizePCanvas();
window.addEventListener('resize', resizePCanvas);

class Particle{
    constructor(){
        this.reset();
    }
    reset(){
        this.x = Math.random() * pCanvas.width;
        this.y = Math.random() * pCanvas.height;
        this.vx = (Math.random() - 0.5) * 0.2;
        this.vy = (Math.random() - 0.5) * 0.2;
        this.size = Math.random() * 1.5 + 0.5;
        this.life = Math.random() * 200 + 100;
        this.maxLife = this.life;
        this.opacity = 0;
    }
    update(){
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
        const progress = this.life / this.maxLife;
        this.opacity = progress < 0.2 ? progress * 5 : (progress > 0.8 ? (1-progress) * 5 : 1);
        if(this.life <= 0 || this.x < 0 || this.x > pCanvas.width || this.y < 0 || this.y > pCanvas.height){
            this.reset();
        }
    }
    draw(){
        pCtx.beginPath();
        pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        pCtx.fillStyle = `rgba(200,190,170,${this.opacity * 0.3})`;
        pCtx.fill();
    }
}

for(let i=0; i<60; i++) particles.push(new Particle());

function animateParticles(){
    pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
    particles.forEach(p=>{p.update();p.draw();});
    requestAnimationFrame(animateParticles);
}
animateParticles();

/* ============================
   SHOOTING STARS
   ============================ */
function createShootingStar(){
    const star = document.createElement('div');
    star.className = 'shooting-star';
    star.style.left = (Math.random() * 60 + 20) + '%';
    star.style.top = (Math.random() * 40) + '%';
    star.style.animation = `shoot ${Math.random() * 0.8 + 0.6}s ease-out forwards`;
    document.body.appendChild(star);
    setTimeout(()=>star.remove(), 2000);
}

const shootStyle = document.createElement('style');
shootStyle.textContent = `
@keyframes shoot{
    0%{transform:translateX(0) translateY(0) rotate(-45deg) scaleX(0);opacity:0;}
    10%{opacity:1;transform:translateX(0) translateY(0) rotate(-45deg) scaleX(1);}
    100%{transform:translateX(-300px) translateY(300px) rotate(-45deg) scaleX(1);opacity:0;}
}`;
document.head.appendChild(shootStyle);

setInterval(()=>{
    if(Math.random() < 0.35) createShootingStar();
}, 4000);

/* ============================
   INTRO SEQUENCE
   ============================ */
const introTexts = [
    "In a quiet night of March 2006...",
    "A little star was born...",
    "This star made my world light up."
];

const introEl = document.getElementById('introText');
const introLine = document.querySelector('.intro-line');
const introSequence = document.getElementById('introSequence');

function splitToChars(text){
    return text.split('').map((ch,i)=>{
        if(ch === ' ') return `<span class="char space" style="transition-delay:${i*0.03}s"></span>`;
        return `<span class="char" style="transition-delay:${i*0.03}s">${ch}</span>`;
    }).join('');
}

let currentIntro = 0;

function showIntroText(){
    introEl.innerHTML = splitToChars(introTexts[currentIntro]);
    introLine.classList.remove('visible');

    requestAnimationFrame(()=>{
        const chars = introEl.querySelectorAll('.char');
        chars.forEach((c,i)=>{
            setTimeout(()=>c.classList.add('visible'), i * 30);
        });
        setTimeout(()=>introLine.classList.add('visible'), chars.length * 30 + 200);
    });

    setTimeout(()=>{
        const chars = introEl.querySelectorAll('.char');
        chars.forEach(c=>c.classList.remove('visible'));
        introLine.classList.remove('visible');

        setTimeout(()=>{
            currentIntro++;
            if(currentIntro < introTexts.length){
                showIntroText();
            } else {
                setTimeout(finishIntro, 800);
            }
        }, 1200);
    }, 4000);
}

function finishIntro(){
    introSequence.style.opacity = '0';
    introSequence.style.visibility = 'hidden';
    setTimeout(()=>{
        introSequence.style.display = 'none';
        showMainScene();
    }, 2000);
}

setTimeout(showIntroText, 600);

/* ============================
   MAIN SCENE REVEAL
   ============================ */
const moonContainer = document.getElementById('moonContainer');
const moonTitle = document.getElementById('moonTitle');
const moonTextContainer = document.getElementById('moonTextContainer');
const moonText = document.getElementById('moonText');
const scrollHint = document.getElementById('scrollHint');

function showMainScene(){
    // Moon rises
    moonContainer.style.transition = 'opacity 3s ease, transform 3s cubic-bezier(0.22,1,0.36,1)';
    moonContainer.style.opacity = '1';
    moonContainer.style.transform = 'translateX(-50%) translateY(0)';
    moonContainer.style.top = '18%';

    // Title fades in
    setTimeout(()=>{
        moonTitle.style.transition = 'opacity 2.5s ease';
        moonTitle.style.opacity = '1';
    }, 500);

    // Text types
    setTimeout(typeMoonText, 2500);

    // Scroll hint
    setTimeout(()=>{
        scrollHint.style.transition = 'opacity 2s ease';
        scrollHint.style.opacity = '1';
    }, 8000);
}

// Initial moon position (below)
moonContainer.style.top = '25%';
moonContainer.style.transform = 'translateX(-50%) translateY(40px)';

/* ============================
   TYPEWRITER EFFECT
   ============================ */
function typeMoonText(){
    const sentence = "This was the moon that watched\nover you on that night.";
    moonTextContainer.style.transition = 'opacity 1.5s ease';
    moonTextContainer.style.opacity = '1';

    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    const typing = setInterval(()=>{
        const ch = sentence.charAt(i);
        if(ch === '\'){
            i++;
            moonText.insertBefore(document.createElement('br'), cursor);
        } else {
            const span = document.createElement('span');
            span.textContent = ch;
            span.style.opacity = '0';
            span.style.transition = 'opacity 0.3s ease';
            moonText.insertBefore(span, cursor);
            requestAnimationFrame(()=>span.style.opacity = '1');
        }
        i++;
        if(i >= sentence.length){
            clearInterval(typing);
            setTimeout(()=>cursor.remove(), 3000);
        }
    }, 70);
}

/* ============================
   MOUSE PARALLAX
   ============================ */
document.addEventListener('mousemove', (e)=>{
    const x = (e.clientX / window.innerWidth - 0.5) * 2;
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    moonContainer.style.transform = `translateX(calc(-50% + ${x * -15}px)) translateY(${y * -10}px)`;
    moonTitle.style.transform = `translateX(calc(-50% + ${x * -8}px)) translateY(${y * -5}px)`;
});

/* ============================
   AMBIENT FLOATING
   ============================ */
let floatTime = 0;
function ambientFloat(){
    floatTime += 0.005;
    const floatY = Math.sin(floatTime) * 8;
    const moonGlow = document.querySelector('.moon-glow');
    const moonOuter = document.querySelector('.moon-outer-glow');
    if(moonGlow) moonGlow.style.transform = `translate(-50%, calc(-50% + ${floatY}px))`;
    if(moonOuter) moonOuter.style.transform = `translate(-50%, calc(-50% + ${floatY * 0.7}px))`;
    requestAnimationFrame(ambientFloat);
}
ambientFloat();
</script>

</body>
</html>
