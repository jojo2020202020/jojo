<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In a Quiet Night of March 2006</title>
<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
width: 100%;
height: 100%;
overflow: hidden;
background: #000;
font-family: Georgia, 'Times New Roman', serif;
}
/* ============================================================
SCENE CONTAINER — holds everything, applies floating motion
============================================================ */
#scene {
position: relative;
width: 100%;
height: 100%;
animation: sceneFloat 20s ease-in-out infinite;
}
@keyframes sceneFloat {
0%, 100% { transform: translate(0, 0) scale(1); }
25%      { transform: translate(4px, -6px) scale(1.002); }
50%      { transform: translate(-3px, 5px) scale(1); }
75%      { transform: translate(6px, 3px) scale(1.001); }
}
/* ============================================================
GALAXY BACKGROUND — deep blue nebula, no stars
============================================================ */
#galaxy-bg {
position: absolute;
inset: 0;
z-index: 0;
opacity: 0;
background:
radial-gradient(ellipse 90% 70% at 25% 35%, rgba(22, 35, 95, 0.55) 0%, transparent 65%),
radial-gradient(ellipse 70% 90% at 75% 65%, rgba(32, 22, 85, 0.45) 0%, transparent 60%),
radial-gradient(ellipse 60% 60% at 50% 50%, rgba(18, 28, 75, 0.65) 0%, transparent 70%),
radial-gradient(ellipse 100% 80% at 40% 60%, rgba(25, 30, 65, 0.35) 0%, transparent 55%),
radial-gradient(ellipse 50% 100% at 60% 30%, rgba(15, 25, 60, 0.3) 0%, transparent 50%),
linear-gradient(180deg, #010205 0%, #060d22 35%, #0a1330 50%, #070e25 65%, #010205 100%);
animation: galaxyFadeIn 4s ease-out forwards;
animation-delay: 5s;
}
@keyframes galaxyFadeIn {
0%   { opacity: 0; }
100% { opacity: 1; }
}
/* ============================================================
STARS CANVAS — main star field + dust + shooting stars
============================================================ */
#stars-canvas {
position: absolute;
inset: 0;
z-index: 1;
display: block;
}
/* ============================================================
MOON WRAPPER — holds moon canvas + bloom layers
============================================================ */
#moon-wrapper {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
z-index: 2;
opacity: 0;
animation: moonFadeIn 3s ease-out forwards;
animation-delay: 9s;
pointer-events: none;
}
@keyframes moonFadeIn {
0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }
100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
#moon-canvas {
display: block;
border-radius: 50%;
/* Soft drop shadow for depth */
box-shadow:
inset -12px -8px 30px rgba(0, 0, 0, 0.45),
0 0 60px rgba(200, 210, 230, 0.15),
0 0 120px rgba(180, 190, 220, 0.08);
animation: moonBreath 6s ease-in-out infinite;
}
@keyframes moonBreath {
0%, 100% {
box-shadow:
inset -12px -8px 30px rgba(0, 0, 0, 0.45),
0 0 60px rgba(200, 210, 230, 0.15),
0 0 120px rgba(180, 190, 220, 0.08),
0 0 200px rgba(160, 175, 210, 0.04);
}
50% {
box-shadow:
inset -12px -8px 30px rgba(0, 0, 0, 0.45),
0 0 80px rgba(200, 210, 230, 0.22),
0 0 160px rgba(180, 190, 220, 0.12),
0 0 280px rgba(160, 175, 210, 0.07);
}
}
/* Outer bloom halo behind moon */
#moon-bloom {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
border-radius: 50%;
pointer-events: none;
animation: bloomPulse 6s ease-in-out infinite;
}
@keyframes bloomPulse {
0%, 100% { opacity: 0.35; transform: translate(-50%, -50%) scale(1); }
50%      { opacity: 0.55; transform: translate(-50%, -50%) scale(1.08); }
}
/* ============================================================
CINEMATIC TEXT
============================================================ */
#cinematic-text {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
z-index: 3;
text-align: center;
color: rgba(245, 245, 250, 0.95);
font-size: clamp(1.2rem, 3vw, 2.2rem);
font-style: italic;
font-weight: 400;
letter-spacing: 0.18em;
line-height: 1.6;
white-space: nowrap;
pointer-events: none;
opacity: 0;
text-shadow:
0 0 20px rgba(255, 255, 255, 0.25),
0 0 50px rgba(255, 255, 255, 0.1),
0 0 90px rgba(255, 255, 255, 0.05);
animation: textSequence 3.9s cubic-bezier(0.4, 0, 0.2, 1) forwards;
animation-delay: 0.8s;
}
@keyframes textSequence {
0% {
opacity: 0;
transform: translate(-50%, calc(-50% + 20px));
filter: blur(6px);
}
25.6% {
opacity: 1;
transform: translate(-50%, -50%);
filter: blur(0px);
}
87.2% {
opacity: 1;
transform: translate(-50%, -50%);
filter: blur(0px);
}
100% {
opacity: 0;
transform: translate(-50%, calc(-50% - 15px));
filter: blur(4px);
}
}
/* ============================================================
VIGNETTE — cinematic dark corners
============================================================ */
#vignette {
position: absolute;
inset: 0;
z-index: 4;
pointer-events: none;
background: radial-gradient(
ellipse at center,
transparent 0%,
transparent 35%,
rgba(0, 0, 0, 0.4) 70%,
rgba(0, 0, 0, 0.85) 100%
);
}
/* ============================================================
FILM GRAIN — subtle texture overlay
============================================================ */
#grain {
position: absolute;
inset: 0;
z-index: 5;
pointer-events: none;
opacity: 0.035;
background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
background-repeat: repeat;
background-size: 200px 200px;
}
</head>
<body>
<div id="scene">
  <!-- Deep blue galaxy background -->
  <div id="galaxy-bg"></div>
  <!-- Star field, dust, shooting stars -->
<canvas id="stars-canvas">
  <!-- Moon with bloom -->
  <div id="moon-wrapper">
    <div id="moon-bloom"></div>
    <canvas id="moon-canvas"></canvas>
  </div>
  <!-- Opening text -->
  <div id="cinematic-text">In a quiet night of March 2006...</div>
  <!-- Cinematic vignette -->
  <div id="vignette"></div>
  <!-- Subtle film grain -->
  <div id="grain"></div>
</div>
<script>
/* ============================================================
   CINEMATIC NIGHT SKY — VANILLA JS
   ============================================================ */

(function() {
  'use strict';

  /* ----------------------------------------------------------
     CONFIGURATION
     ---------------------------------------------------------- */
  const CONFIG = {
    starCount: 2600,
    dustCount: 45,
    starAppearDuration: 7000, // ms over which stars fade in
    starAppearStart: 4700,    // ms after page load
    shootingStarChance: 0.0008, // per frame
    parallaxStrength: { stars: 12, moon: 6, bg: 3 }
  };

  /* ----------------------------------------------------------
     DOM REFERENCES
     ---------------------------------------------------------- */
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const moonCanvas = document.getElementById('moon-canvas');
  const moonCtx = moonCanvas.getContext('2d');
  const moonBloom = document.getElementById('moon-bloom');
  const scene = document.getElementById('scene');

  /* ----------------------------------------------------------
     STATE
     ---------------------------------------------------------- */
  let width, height;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let startTime = performance.now();
  let mouseX = 0, mouseY = 0;
  let targetMouseX = 0, targetMouseY = 0;
  let stars = [];
  let dust = [];
  let shootingStars = [];

  /* ----------------------------------------------------------
     RESIZE HANDLER
     ---------------------------------------------------------- */
  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;

    // Main canvas
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Moon canvas — responsive size
    const moonSize = Math.min(width, height) * 0.32;
    const canvasSize = moonSize + 80;
    moonCanvas.width = canvasSize * dpr;
    moonCanvas.height = canvasSize * dpr;
    moonCanvas.style.width = canvasSize + 'px';
    moonCanvas.style.height = canvasSize + 'px';
    moonCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Bloom size
    moonBloom.style.width = (canvasSize * 1.6) + 'px';
    moonBloom.style.height = (canvasSize * 1.6) + 'px';

    drawMoon(moonSize, canvasSize);
    initStars();
    initDust();
  }

  /* ----------------------------------------------------------
     MOON — PROCEDURAL DRAWING
     ---------------------------------------------------------- */
  function drawMoon(moonSize, canvasSize) {
    const cx = canvasSize / 2;
    const cy = canvasSize / 2;
    const r = moonSize / 2;

    moonCtx.clearRect(0, 0, canvasSize, canvasSize);

    // Base radial gradient — soft lunar surface
    const baseGrad = moonCtx.createRadialGradient(
      cx - r * 0.25, cy - r * 0.25, r * 0.05,
      cx, cy, r
    );
    baseGrad.addColorStop(0, '#f8f8fa');
    baseGrad.addColorStop(0.3, '#e2e2e8');
    baseGrad.addColorStop(0.7, '#b8b8c4');
    baseGrad.addColorStop(1, '#8a8a9a');

    moonCtx.beginPath();
    moonCtx.arc(cx, cy, r, 0, Math.PI * 2);
    moonCtx.fillStyle = baseGrad;
    moonCtx.fill();

    // Maria (dark lunar plains) — large soft patches
    const maria = [
      { x: -0.15, y: 0.05, rx: 0.35, ry: 0.25, rot: 0.3 },
      { x: 0.25, y: -0.2, rx: 0.28, ry: 0.2, rot: -0.5 },
      { x: 0.1, y: 0.35, rx: 0.22, ry: 0.18, rot: 0.8 },
      { x: -0.3, y: -0.25, rx: 0.2, ry: 0.15, rot: 1.2 },
    ];

    moonCtx.save();
    moonCtx.beginPath();
    moonCtx.arc(cx, cy, r, 0, Math.PI * 2);
    moonCtx.clip();

    maria.forEach(m => {
      moonCtx.save();
      moonCtx.translate(cx + m.x * r, cy + m.y * r);
      moonCtx.rotate(m.rot);
      const mg = moonCtx.createRadialGradient(0, 0, 0, 0, 0, m.rx * r);
      mg.addColorStop(0, 'rgba(110, 110, 125, 0.5)');
      mg.addColorStop(1, 'rgba(110, 110, 125, 0)');
      moonCtx.beginPath();
      moonCtx.ellipse(0, 0, m.rx * r, m.ry * r, 0, 0, Math.PI * 2);
      moonCtx.fillStyle = mg;
      moonCtx.fill();
      moonCtx.restore();
    });
    moonCtx.restore();

    // Craters — various sizes with inner shadow feel
    const craters = [
      { x: -0.22, y: -0.12, r: 0.14 },
      { x: 0.32, y: 0.18, r: 0.11 },
      { x: -0.08, y: 0.28, r: 0.09 },
      { x: 0.18, y: -0.32, r: 0.08 },
      { x: -0.38, y: 0.22, r: 0.07 },
      { x: 0.42, y: -0.08, r: 0.06 },
      { x: 0.05, y: -0.18, r: 0.05 },
      { x: -0.15, y: 0.42, r: 0.055 },
      { x: 0.28, y: 0.38, r: 0.045 },
      { x: -0.35, y: -0.35, r: 0.04 },
      { x: 0.12, y: 0.08, r: 0.035 },
      { x: -0.05, y: -0.42, r: 0.03 },
      { x: 0.38, y: 0.32, r: 0.025 },
      { x: -0.28, y: 0.05, r: 0.02 },
    ];

    craters.forEach(c => {
      const cx_ = cx + c.x * r;
      const cy_ = cy + c.y * r;
      const cr = c.r * r;

      // Crater shadow (bottom-right)
      moonCtx.beginPath();
      moonCtx.arc(cx_ + cr * 0.15, cy_ + cr * 0.15, cr, 0, Math.PI * 2);
      const shadowGrad = moonCtx.createRadialGradient(
        cx_ + cr * 0.15, cy_ + cr * 0.15, 0,
        cx_ + cr * 0.15, cy_ + cr * 0.15, cr
      );
      shadowGrad.addColorStop(0, 'rgba(80, 80, 95, 0.35)');
      shadowGrad.addColorStop(1, 'rgba(80, 80, 95, 0)');
      moonCtx.fillStyle = shadowGrad;
      moonCtx.fill();

      // Crater highlight (top-left)
      moonCtx.beginPath();
      moonCtx.arc(cx_ - cr * 0.1, cy_ - cr * 0.1, cr * 0.85, 0, Math.PI * 2);
      const highlightGrad = moonCtx.createRadialGradient(
        cx_ - cr * 0.1, cy_ - cr * 0.1, 0,
        cx_ - cr * 0.1, cy_ - cr * 0.1, cr * 0.85
      );
      highlightGrad.addColorStop(0, 'rgba(200, 200, 210, 0.2)');
      highlightGrad.addColorStop(1, 'rgba(200, 200, 210, 0)');
      moonCtx.fillStyle = highlightGrad;
      moonCtx.fill();
    });

    // Subtle rim light on the right edge
    const rimGrad = moonCtx.createRadialGradient(
      cx + r * 0.3, cy - r * 0.1, r * 0.5,
      cx, cy, r
    );
    rimGrad.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
    rimGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

    moonCtx.save();
    moonCtx.beginPath();
    moonCtx.arc(cx, cy, r, 0, Math.PI * 2);
    moonCtx.clip();
    moonCtx.fillStyle = rimGrad;
    moonCtx.fillRect(0, 0, canvasSize, canvasSize);
    moonCtx.restore();

    // Bloom gradient for the #moon-bloom div
    const bloomSize = canvasSize * 1.6;
    const bloomCanvas = document.createElement('canvas');
    bloomCanvas.width = bloomSize;
    bloomCanvas.height = bloomSize;
    const bctx = bloomCanvas.getContext('2d');
    const bg = bctx.createRadialGradient(
      bloomSize / 2, bloomSize / 2, bloomSize * 0.25,
      bloomSize / 2, bloomSize / 2, bloomSize * 0.5
    );
    bg.addColorStop(0, 'rgba(200, 210, 235, 0.25)');
    bg.addColorStop(0.5, 'rgba(180, 190, 220, 0.08)');
    bg.addColorStop(1, 'rgba(180, 190, 220, 0)');
    bctx.fillStyle = bg;
    bctx.fillRect(0, 0, bloomSize, bloomSize);
    moonBloom.style.background = `url(${bloomCanvas.toDataURL()}) no-repeat center`;
    moonBloom.style.backgroundSize = 'contain';
  }

  /* ----------------------------------------------------------
     STAR SYSTEM
     ---------------------------------------------------------- */
  function initStars() {
    stars = [];
    for (let i = 0; i < CONFIG.starCount; i++) {
      const isSpecial = Math.random() < 0.03; // 3% are special bright stars
      const hasBlueTint = Math.random() < 0.08; // 8% slight blue tint

      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: isSpecial
          ? Math.random() * 1.8 + 1.0
          : Math.random() * 1.4 + 0.3,
        baseOpacity: isSpecial
          ? Math.random() * 0.4 + 0.6
          : Math.random() * 0.5 + 0.15,
        twinkleSpeed: Math.random() * 2.5 + 0.5, // unique per star
        twinklePhase: Math.random() * Math.PI * 2,
        appearDelay: Math.random() * CONFIG.starAppearDuration,
        color: hasBlueTint
          ? { r: 200, g: 210, b: 255 }
          : { r: 255, g: 255, b: 245 },
        isSpecial: isSpecial,
        sparkleIntensity: isSpecial ? Math.random() * 0.4 + 0.2 : 0
      });
    }
  }

  /* ----------------------------------------------------------
     DUST PARTICLES
     ---------------------------------------------------------- */
  function initDust() {
    dust = [];
    for (let i = 0; i < CONFIG.dustCount; i++) {
      dust.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 1.2 + 0.3,
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.1 - 0.05, // slight upward drift
        opacity: Math.random() * 0.25 + 0.05,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  /* ----------------------------------------------------------
     SHOOTING STAR CLASS
     ---------------------------------------------------------- */
  class ShootingStar {
    constructor() {
      const side = Math.floor(Math.random() * 2); // 0 = top, 1 = left
      if (side === 0) {
        this.x = Math.random() * width;
        this.y = -20;
      } else {
        this.x = -20;
        this.y = Math.random() * height * 0.5;
      }
      const angle = Math.random() * 0.5 + 0.3; // downward-right angle
      const speed = Math.random() * 8 + 12;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.length = Math.random() * 60 + 40;
      this.opacity = 1;
      this.fadeRate = Math.random() * 0.008 + 0.004;
      this.width = Math.random() * 1.5 + 0.5;
      this.active = true;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.opacity -= this.fadeRate;
      if (this.opacity <= 0 || this.x > width + 100 || this.y > height + 100) {
        this.active = false;
      }
    }

    draw(ctx) {
      if (!this.active) return;
      const tailX = this.x - this.vx * (this.length / 12);
      const tailY = this.y - this.vy * (this.length / 12);

      const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
      grad.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`);
      grad.addColorStop(0.3, `rgba(220, 230, 255, ${this.opacity * 0.7})`);
      grad.addColorStop(1, `rgba(200, 210, 255, 0)`);

      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(tailX, tailY);
      ctx.strokeStyle = grad;
      ctx.lineWidth = this.width;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Bright head
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.width * 1.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * 0.9})`;
      ctx.fill();
    }
  }

  /* ----------------------------------------------------------
     PARALLAX — mouse tracking
     ---------------------------------------------------------- */
  function onMouseMove(e) {
    targetMouseX = (e.clientX / width - 0.5) * 2;
    targetMouseY = (e.clientY / height - 0.5) * 2;
  }

  function onTouchMove(e) {
    if (e.touches.length > 0) {
      targetMouseX = (e.touches[0].clientX / width - 0.5) * 2;
      targetMouseY = (e.touches[0].clientY / height - 0.5) * 2;
    }
  }

  /* ----------------------------------------------------------
     MAIN RENDER LOOP
     ---------------------------------------------------------- */
  function render(now) {
    const elapsed = now - startTime;

    // Smooth parallax interpolation
    mouseX += (targetMouseX - mouseX) * 0.04;
    mouseY += (targetMouseY - mouseY) * 0.04;

    // Apply parallax to layers via CSS transforms
    const pxStars = mouseX * CONFIG.parallaxStrength.stars;
    const pyStars = mouseY * CONFIG.parallaxStrength.stars;
    const pxMoon = mouseX * CONFIG.parallaxStrength.moon;
    const pyMoon = mouseY * CONFIG.parallaxStrength.moon;
    const pxBg = mouseX * CONFIG.parallaxStrength.bg;
    const pyBg = mouseY * CONFIG.parallaxStrength.bg;

    canvas.style.transform = `translate(${pxStars}px, ${pyStars}px)`;
    document.getElementById('moon-wrapper').style.transform =
      `translate(calc(-50% + ${pxMoon}px), calc(-50% + ${pyMoon}px))`;
    document.getElementById('galaxy-bg').style.transform =
      `translate(${pxBg}px, ${pyBg}px) scale(1.05)`;

    // Clear canvas
    ctx.clearRect(0, 0, width, height);

    // --- Dust particles ---
    for (let i = 0; i < dust.length; i++) {
      const d = dust[i];
      d.x += d.vx;
      d.y += d.vy;

      // Wrap around screen
      if (d.x < -10) d.x = width + 10;
      if (d.x > width + 10) d.x = -10;
      if (d.y < -10) d.y = height + 10;
      if (d.y > height + 10) d.y = -10;

      const flicker = Math.sin(elapsed * 0.001 + d.phase) * 0.1 + 0.9;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220, 225, 240, ${d.opacity * flicker})`;
      ctx.fill();
    }

    // --- Stars ---
    const appearProgress = Math.max(0, Math.min(1,
      (elapsed - CONFIG.starAppearStart) / CONFIG.starAppearDuration
    ));

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];

      // Appearance delay — each star fades in at its own time
      let starAppear = (appearProgress * CONFIG.starAppearDuration - s.appearDelay) / 800;
      starAppear = Math.max(0, Math.min(1, starAppear));

      if (starAppear <= 0) continue;

      // Twinkle calculation — never synchronizes due to unique phase + speed
      const twinkle = Math.sin(elapsed * 0.001 * s.twinkleSpeed + s.twinklePhase);
      let opacity = s.baseOpacity;

      if (s.isSpecial) {
        // Special stars sparkle more dramatically
        const sparkle = Math.sin(elapsed * 0.003 * s.twinkleSpeed + s.twinklePhase * 2);
        opacity += sparkle * s.sparkleIntensity;
        opacity = Math.max(0.2, Math.min(1, opacity));
      } else {
        // Normal gentle twinkle
        opacity += twinkle * 0.15;
        opacity = Math.max(0.05, Math.min(s.baseOpacity + 0.15, opacity));
      }

      opacity *= starAppear;

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${s.color.r}, ${s.color.g}, ${s.color.b}, ${opacity})`;
      ctx.fill();

      // Extra glow for special bright stars
      if (s.isSpecial && starAppear > 0.5) {
        const glowOpacity = opacity * 0.3;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size * 3, 0, Math.PI * 2);
        const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 3);
        g.addColorStop(0, `rgba(${s.color.r}, ${s.color.g}, ${s.color.b}, ${glowOpacity})`);
        g.addColorStop(1, `rgba(${s.color.r}, ${s.color.g}, ${s.color.b}, 0)`);
        ctx.fillStyle = g;
        ctx.fill();
      }
    }

    // --- Shooting stars ---
    if (Math.random() < CONFIG.shootingStarChance && elapsed > 6000) {
      shootingStars.push(new ShootingStar());
    }

    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const ss = shootingStars[i];
      ss.update();
      ss.draw(ctx);
      if (!ss.active) {
        shootingStars.splice(i, 1);
      }
    }

    requestAnimationFrame(render);
  }

  /* ----------------------------------------------------------
     INITIALIZATION
     ---------------------------------------------------------- */
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('touchmove', onTouchMove, { passive: true });

  resize();
  requestAnimationFrame(render);

})();
</script>
</body>
</html>
